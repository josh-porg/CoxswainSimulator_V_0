# Build the trainer for Windows, macOS and Linux, and attach all
# three to a release.
#
# WHY THIS EXISTS
# ---------------
# PyInstaller does not cross-compile.  It works by bundling the running
# interpreter and the actual binary extension modules from the machine
# it is on, so a macOS build has to happen on a macOS machine.  There is
# no Mac here, and GitHub gives free runners for public repositories, so
# the Mac build happens there.
#
# All three build from the SAME tag and the same pinned
# requirements, so the downloads can only differ by platform.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to build and upload to.  It must point at a commit that
          CONTAINS this workflow and requirements-build.txt, because the
          runner checks out the tag and builds that tree -- dispatching
          against an older tag checks out code that has no build tooling
          in it and fails at the install step.  Normally: make a new tag
          and push it, which runs this anyway.
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: Coxswain
          # APPLE SILICON ONLY, and not by choice.
          #
          # This said macos-13 -- the last free Intel runner -- reasoning
          # that an x86_64 build also runs on Apple Silicon under Rosetta
          # so one download would cover everyone.  The reasoning was
          # sound and the label is gone: GitHub has retired it, and the
          # job sat queued for fifty minutes with no runner able to
          # match it, while Windows and Linux were picked up in three
          # seconds.  A retired label does not fail, it waits for ever.
          #
          # Every macOS image GitHub still publishes is arm64, and Intel
          # is now a paid "-large" tier.  So this builds arm64, needing
          # a 2020 Mac or newer.  An Intel Mac cannot run it at all, and
          # that has to be said plainly on the download page rather than
          # left to be discovered.
          - os: macos-15
            name: mac
            artifact: Coxswain-mac
          # ubuntu-22.04, not ubuntu-latest.  A Linux binary links
          # against the glibc it was BUILT against and will not start on
          # anything older: build on 24.04 (glibc 2.39) and it refuses
          # to run on Debian 12, Mint 21 or Ubuntu 22.04 itself, which
          # is most of the machines anyone actually has.  22.04 is glibc
          # 2.35 and runs on everything newer, which is the direction
          # compatibility works in.
          - os: ubuntu-22.04
            name: linux
            artifact: Coxswain

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries SDL and OpenGL need
        if: matrix.name == 'linux'
        run: |
          # Only for the smoke test below: pygame's wheel carries its
          # own SDL, but SDL still dlopen's the system's GL and audio
          # libraries at run time, and a bare runner has none of them.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglx-mesa0 libegl1 \
            libgles2 libsdl2-2.0-0 libasound2 libpulse0 libxrandr2 \
            libxcursor1 libxi6 libxinerama1 xvfb

      - name: Say what we are actually building on
        shell: bash
        run: |
          # On record in every build, because the last surprise here was
          # a runner label that had quietly stopped existing.
          echo "runner os   : ${{ matrix.os }}"
          echo "machine arch: $(uname -m 2>/dev/null || echo n/a)"
          python -c "import platform, sys; print('python arch:', platform.machine())"

      - name: Install what the trainer needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build
        env:
          COXSWAIN_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: python tools/build_exe.py --onedir

      - name: Check the payload actually got in
        shell: bash
        run: |
          # A build that succeeds and ships without its data files dies
          # on somebody else's machine, which is the failure this whole
          # arrangement exists to avoid.
          #
          # Checked by LOOKING FOR THE FILES, not by rendering.  The
          # render test below is better evidence when it can run, but it
          # needs a GL context, and whether a CI runner can give one is
          # a fact about the runner rather than about the artefact.
          set -e
          case "${{ matrix.name }}" in
            mac)   ROOT="dist/Coxswain-mac/Coxswain.app/Contents/Resources" ;;
            *)     ROOT="dist/Coxswain/_internal" ;;
          esac
          python - "$ROOT" <<'CHECK'
          import os, sys
          sys.path.insert(0, "tools")
          from build_exe import discover_payload
          root = sys.argv[1]
          missing = []
          for name in discover_payload():
              leaf = name.replace("\\", "/").split("/")[-1]
              found = any(leaf in files
                          for _b, _d, files in os.walk(root))
              if not found:
                  missing.append(leaf)
          print("payload inside the build: %d of %d present"
                % (len(discover_payload()) - len(missing),
                   len(discover_payload())))
          if missing:
              print("MISSING:", ", ".join(missing))
              raise SystemExit(1)
          CHECK

      - name: Render every course from the built artefact
        shell: bash
        run: |
          # The real proof: does the packaged thing actually draw?
          #
          # TIMEOUT, because this hung for fifty-two minutes on Windows
          # -- the job never failed, it simply stopped, and a hung job
          # blocks the publish step and therefore the whole release.  A
          # windowed Windows build has no console to report to, so a
          # failure there is silent by construction.
          #
          # Not fatal on Windows for the same reason it hangs: the
          # runner is a headless service session with no usable GL, and
          # that is a fact about the runner.  The payload check above
          # has already passed, and the Windows artefact is built and
          # run locally before release.  On macOS and Linux, where a
          # context is available, a failure here still fails the build.
          case "${{ matrix.name }}" in
            mac)   APP="dist/Coxswain-mac/Coxswain.app/Contents/MacOS/Coxswain" ;;
            linux) APP="dist/Coxswain/Coxswain" ;;
            *)     APP="dist/Coxswain/Coxswain.exe" ;;
          esac
          RUN=""
          [ "${{ matrix.name }}" = "linux" ] && RUN="xvfb-run -a"

          # `timeout` is GNU coreutils and macOS does not ship it.  The
          # first version of this bound used it unconditionally and so
          # failed the ONE platform that had never hung -- the guard
          # against a hang became the thing that broke the build.
          # gtimeout is coreutils under Homebrew; if neither is there,
          # run unbounded rather than not at all.
          if command -v timeout >/dev/null 2>&1; then
            LIMIT="timeout 240"
          elif command -v gtimeout >/dev/null 2>&1; then
            LIMIT="gtimeout 240"
          else
            LIMIT=""
            echo "note: no timeout command here; running unbounded"
          fi

          ok=1
          for course in charles totl hotl; do
            echo "--- $course"
            if SDL_VIDEODRIVER=dummy $LIMIT $RUN "$APP"                  --race "$course" --boat 8+ --no-menu                  --shot "/tmp/$course.png" --width 320 --height 180; then
              echo "    rendered"
            else
              echo "    FAILED or timed out (exit $?)"
              ok=0
            fi
          done
          if [ "$ok" = "1" ]; then
            echo "all three courses ran"
          elif [ "${{ matrix.name }}" = "windows" ]; then
            echo "::warning::Windows runner could not render; payload was"                 "verified by file presence and the artefact is checked"                 "locally before release."
          else
            echo "::error::the packaged build could not render"
            exit 1
          fi

      - name: Sign the bundle, so macOS does not call it damaged
        if: matrix.name == 'mac'
        run: |
          # Ad-hoc signing: a signature with no identity behind it.  It
          # is free, needs no Apple account, and it is NOT notarisation
          # -- Gatekeeper will still ask before the first launch.
          #
          # What it changes is WHICH question it asks.  An unsigned
          # bundle that has been quarantined fails signature validation
          # outright, and macOS reports that as "Coxswain is damaged and
          # can't be opened" with a single Cancel button -- which reads
          # as a corrupt download, and is the single most likely reason
          # somebody gives up before ever seeing the boat.
          #
          # Ad-hoc signed, the signature is valid, it is only unknown.
          # So the message becomes "unidentified developer", which is
          # accurate, and right-click then Open works cleanly.
          #
          # --deep because a PyInstaller bundle carries a hundred-odd
          # nested .so files that each need covering; --force because
          # PyInstaller writes its own placeholder signature first.
          codesign --force --deep --sign - dist/Coxswain-mac/Coxswain.app
          codesign --verify --deep --strict --verbose=2 \
            dist/Coxswain-mac/Coxswain.app
          echo "--- what Gatekeeper will see ---"
          spctl --assess --type execute --verbose=4 \
            dist/Coxswain-mac/Coxswain.app 2>&1 || true

      # -- Windows code signing, through SignPath's free open-source plan.
      #
      # Only the executable is signed: SmartScreen judges the file that
      # is launched, and signing every DLL in a 400-file PyInstaller
      # tree is slow for no gain.  The whole block is skipped -- not
      # failed -- when the secrets are absent, so a fork or a checkout
      # without the SignPath project still builds and releases; it just
      # ships the unsigned exe the same as before.  docs/SIGNING.md has
      # what has to exist on the SignPath side for this to run.
      - name: Hand the executable to SignPath
        id: unsigned
        if: matrix.name == 'windows' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: Coxswain-windows-unsigned
          path: dist/Coxswain/Coxswain.exe
          if-no-files-found: error

      - name: Sign it
        if: matrix.name == 'windows' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Put the signed executable back
        if: matrix.name == 'windows' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: bash
        run: |
          test -f signed/Coxswain.exe
          cp signed/Coxswain.exe dist/Coxswain/Coxswain.exe
          # Prove it: a signed PE carries an Authenticode signature
          # block.  A silent miss here would ship unsigned with a green
          # tick, which is worse than shipping unsigned on purpose.
          powershell -NoProfile -Command \
            "\$s = Get-AuthenticodeSignature dist/Coxswain/Coxswain.exe; \
             Write-Output ('signature: ' + \$s.Status + ' by ' + \$s.SignerCertificate.Subject); \
             if (\$s.Status -ne 'Valid') { exit 1 }"

      - name: Zip it
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "linux" ]; then
            # tar.gz, not zip: the executable bit has to survive, and a
            # zip does not reliably carry it.  Someone unzipping to a
            # non-executable binary gets "permission denied" and no clue
            # why.
            chmod +x Coxswain/Coxswain
            tar -czf ../Coxswain-linux.tar.gz Coxswain
          elif [ "${{ matrix.name }}" = "mac" ]; then
            # ditto, not zip: it preserves the symlinks and the
            # executable bits inside a .app bundle, and a plain zip
            # quietly breaks the bundle so it will not launch.
            ditto -c -k --sequesterRsrc --keepParent \
              Coxswain-mac ../Coxswain-mac.zip
          else
            7z a -tzip ../Coxswain-windows.zip Coxswain >/dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Coxswain-${{ matrix.name }}
          path: |
            Coxswain-*.zip
            Coxswain-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # for packaging/RELEASE_NOTES.md
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach them all to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -la
          # Create the release if it is not there yet, so that pushing a
          # tag is all it takes.  Uploading to a tag with no release is
          # an error, and that is easy to hit when the tag push is what
          # started this in the first place.
          # Notes come from the repository, so every release carries
          # the same instructions and they are reviewed like code.  The
          # awkward parts -- SmartScreen, Gatekeeper, glibc -- are
          # exactly what people need before they download, not after.
          NOTES=packaging/RELEASE_NOTES.md
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --repo "$REPO"                 --title "Coxswain $TAG" --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" --repo "$REPO"                 --title "Coxswain $TAG" --latest                 --notes "Builds for Windows, macOS and Linux are below."
            fi
          fi
          gh release upload "$TAG" Coxswain-*.zip Coxswain-*.tar.gz \
            --clobber --repo "$REPO"
