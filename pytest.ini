[pytest]
testpaths = tests
markers =
    slow: anything that integrates the boat forward, builds a river channel,
        or solves a trajectory.  Everything under tests/integration and
        tests/regression is marked automatically by their conftest files;
        expensive unit tests carry the marker explicitly.
        Fast suite:  pytest -m "not slow"     (~1 min, the edit-run loop)
        Full suite:  pytest                   (~30 min, before committing)
filterwarnings =
    error::RuntimeWarning
