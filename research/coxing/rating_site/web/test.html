<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rating site test harness</title>
<style>
body { margin:0; font:14px/1.5 system-ui, sans-serif; display:grid; grid-template-columns:300px 1fr; height:100vh; }
aside { padding:12px; border-right:1px solid #ccc; overflow:auto; } iframe { width:100%; height:100%; border:0; }
button { margin:4px 4px 4px 0; } pre { font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<aside>
<b>Test harness (never deployed)</b>
<p>Runs the real Code.gs with in-memory stand-ins for Google Sheets, properties, cache, URL fetch and locks.</p>
<div>Day: <span id="day"></span></div>
<button id="nextday">Next day</button>
<button id="rater">Rater view</button>
<button id="admin">Admin view</button>
<button id="reset">Forget this browser's username</button>
<pre id="state"></pre>
</aside>
<iframe id="f"></iframe>
<script>
// ---- stand-ins for the Apps Script services Code.gs uses
const SHEET = {}, PROPS = {}, CACHE = {};
const sheetObj = n => ({
  appendRow: r => SHEET[n].push(r.slice()),
  getDataRange: () => ({ getValues: () => SHEET[n].map(r => r.slice()) }),
  getRange: (a, b, c, d) => typeof a === "string" ? { setNumberFormat() {} } : { setValues: v => { SHEET[n][a - 1] = v[0].slice(); } },
});
window.SpreadsheetApp = { getActiveSpreadsheet: () => ({ getSheetByName: n => SHEET[n] ? sheetObj(n) : null, insertSheet: n => { SHEET[n] = []; return sheetObj(n); } }) };
window.PropertiesService = { getScriptProperties: () => ({ getProperty: k => k in PROPS ? PROPS[k] : null }) };
window.CacheService = { getScriptCache: () => ({ get: k => k in CACHE ? CACHE[k] : null, put: (k, v) => { CACHE[k] = v; } }) };
window.UrlFetchApp = { fetch: url => { const x = new XMLHttpRequest(); x.open("GET", url, false); x.send(); return { getContentText: () => x.responseText }; } };
window.ContentService = { MimeType: { JSON: "json" }, createTextOutput: s => ({ setMimeType() { return this; }, getContent: () => s }) };
window.LockService = { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
window.Utilities = { formatDate: d => d.toISOString().slice(0, 10) };
window.Session = { getScriptTimeZone: () => "UTC" };

const hp = new URLSearchParams(location.hash.slice(1)), K = hp.get("k"), ADMIN = hp.get("admin");
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
let day = new Date(Date.UTC(2026, 10, 9));
const show = () => {
  document.getElementById("day").textContent = PROPS.TEST_DAY;
  document.getElementById("state").textContent = Object.entries(SHEET).map(([n, v]) => n + ": " + (v.length - 1) + " rows").join("\n");
};
(async () => {
  PROPS.WRITE_TOKEN = b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("write:" + K)));
  PROPS.ADMIN_KEY = ADMIN; PROPS.MANIFEST_URL = "manifest.json"; PROPS.TEST_DAY = day.toISOString().slice(0, 10);
  const code = await (await fetch("Code.gs")).text();
  const s = document.createElement("script"); s.textContent = code; document.body.appendChild(s);
  window.MOCK_BACKEND = async p => { const r = JSON.parse(doPost({ postData: { contents: JSON.stringify(p) } }).getContent()); setTimeout(show, 0); return r; };
  const f = document.getElementById("f");
  const go = admin => { f.src = "index.html?" + Date.now() + "#k=" + K + (admin ? "&admin=" + ADMIN : ""); };
  document.getElementById("rater").onclick = () => go(false);
  document.getElementById("admin").onclick = () => go(true);
  document.getElementById("nextday").onclick = () => { day = new Date(day.getTime() + 86400000); PROPS.TEST_DAY = day.toISOString().slice(0, 10); show(); go(false); };
  document.getElementById("reset").onclick = () => { localStorage.removeItem("coxrate_v1"); go(false); };
  show(); go(false);
})();
</script>
</body>
</html>
